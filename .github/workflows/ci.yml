name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    # This canonical pull-request job stays on a disposable hosted VM. Trusted main pushes use
    # the PiPlay runner label after PIPLAY_WINDOWS_RUNNER is configured;
    # leaving the variable unset is the safe hosted fallback while infrastructure is serviced.
    # A registered runner for a public repo must still be disposable: contributed workflows can
    # propose targeting its label directly, outside this job's routing expression.
    runs-on: ${{ case(github.event_name == 'pull_request', 'windows-latest', vars.PIPLAY_WINDOWS_RUNNER || 'windows-latest') }}
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node for executable DOM tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run deterministic local CI gate
        shell: pwsh
        run: .\scripts\Test-LocalCI.ps1
